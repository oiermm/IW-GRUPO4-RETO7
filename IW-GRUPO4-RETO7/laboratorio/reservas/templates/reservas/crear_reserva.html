{% extends 'reservas/base.html' %}

{% block title %}Crear Reserva{% endblock %}

{% block content %}

<h1>Crear reserva</h1>

<a href="{% url 'lista_reservas' %}" class="botones">⬅ Volver a la lista</a>

<hr>

{% if form.non_field_errors %}
    <div style="background:#ffdddd; border:1px solid red; padding:10px; margin-bottom:10px;">
        {% for error in form.non_field_errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton-enviar">Guardar reserva</button>
</form>

{% endblock %}
