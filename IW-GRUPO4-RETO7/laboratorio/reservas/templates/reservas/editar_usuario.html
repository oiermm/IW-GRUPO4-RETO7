{% extends 'reservas/base.html' %}

{% block content %}

<h1>Editar usuario</h1>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="token" value="{{ request.GET.token }}">
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'lista_usuarios' %}?token={{ request.GET.token }}">Cancelar</a>
</form>

{% endblock %}
